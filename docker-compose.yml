# Pharma cold-chain DWH + BI pipeline - local stack.
#   postgres   : staging (ODS), ops metrics, published marts, and Airflow's own metadata DB
#   airflow    : webserver (UI on :8080) + scheduler (runs the DAGs)
#   ingest-api : Flask REST API that loads a file into staging (:8000)
#   watcher    : Python file-watcher that watches data/landing and calls the API
#   grafana    : observability dashboards (:3000)
x-airflow-common: &airflow-common
  build: .
  image: pharma-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__WEBSERVER__SECRET_KEY: "pharma-dwh-demo-secret"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "15"
    PYTHONPATH: /opt/airflow/include
    PG_HOST: postgres
    PG_DB: pharma
    PG_USER: airflow
    PG_PASSWORD: airflow
    DATA_DIR: /opt/airflow/data
    DUCKDB_PATH: /opt/airflow/warehouse/pharma_dwh.duckdb
    INGEST_API_URL: http://ingest-api:8000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./warehouse:/opt/airflow/warehouse
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./include/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary init server only listens on a socket,
      # so this turns healthy only after the init SQL has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d pharma"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-api:
    <<: *airflow-common
    command: ["python", "-m", "gunicorn", "-w", "1", "--threads", "2", "-t", "0", "-b", "0.0.0.0:8000", "ingestion.api:app"]
    ports: ["8000:8000"]
    restart: unless-stopped

  watcher:
    <<: *airflow-common
    command: ["python", "-u", "/opt/airflow/include/ingestion/watcher.py"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/1_batch_ingestion.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  grafanadata:
